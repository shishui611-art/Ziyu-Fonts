<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字域在线开源字体库 · Ziyu Fonts</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --fg: #181c25;
      --muted: #5c667a;
      --border: #e3e7f0;
      --accent: #2563eb;
      --pill: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1a1d24;
        --fg: #eef1f7;
        --muted: #9aa4b8;
        --border: #2c313d;
        --accent: #7aaeff;
        --pill: #243047;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 18px 56px; }
    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; }
    .sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    input[type="search"] { flex: 1 1 240px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 14px; }
    .btn { padding: 9px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; font-size: 13px; }
    .btn.active { background: var(--accent); color: #fff; border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; display: block; background: var(--bg); }
    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .name { font-weight: 700; font-size: 16px; }
    .stars { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .desc { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--pill); color: var(--accent); }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    .actions a { flex: 1; text-align: center; text-decoration: none; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); color: var(--fg); }
    .actions a.primary { background: var(--accent); color: #fff; border-color: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>字域在线开源字体库</h1>
        <p class="sub" id="notice">仅收录开源协议字体，供字域 App 直接预览、校验与一键应用。</p>
      </div>
      <div class="sub" id="meta">正在加载清单…</div>
    </header>
    <div class="bar">
      <input id="q" type="search" placeholder="搜索字体名、风格或作者…" />
      <button class="btn active" data-cat="all">全部</button>
      <button class="btn" data-cat="cjk">中文</button>
      <button class="btn" data-cat="latin">英文 / 数字</button>
      <button class="btn" data-cat="var">可变字体</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let allFonts = [];
    let activeCat = 'all';
    const qEl = document.getElementById('q');
    const grid = document.getElementById('grid');

    function fmtBytes(n) {
      if (!n) return '0 B';
      const u = ['B', 'KB', 'MB', 'GB'];
      let i = 0, v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(i >= 2 ? 1 : 0)} ${u[i]}`;
    }

    function render() {
      const q = qEl.value.trim().toLowerCase();
      const list = allFonts.filter(f => {
        if (activeCat === 'cjk' && !f.supportsCjk) return false;
        if (activeCat === 'latin' && f.supportsCjk) return false;
        if (activeCat === 'var' && !f.variable) return false;
        if (!q) return true;
        return `${f.name} ${f.englishName} ${f.author} ${f.style} ${f.description} ${(f.tags || []).join(' ')}`.toLowerCase().includes(q);
      });
      grid.innerHTML = list.map(f => {
        const img = dark && f.previewDark ? f.previewDark : f.preview;
        const w = f.variable ? '可变字体' : (f.weights && f.weights.length >= 2 ? `多字重 · ${f.weights.length} 档` : '单字重');
        return `
          <article class="card">
            <img src="${img}" alt="${f.name}" loading="lazy" />
            <div class="body">
              <div class="title-row">
                <div class="name">${f.name}</div>
                <div class="stars">★ ${f.stars ? (f.stars >= 1000 ? (f.stars/1000).toFixed(1) + 'k' : f.stars) : ''}</div>
              </div>
              <div class="pills">
                <span class="pill">${f.supportsCjk ? '中文' : '英文 / 数字'}</span>
                <span class="pill">${w}</span>
                <span class="pill">${f.license}</span>
                <span class="pill">${fmtBytes(f.size)}</span>
              </div>
              <div class="desc">${f.description || ''}</div>
              <div class="actions">
                <a class="primary" href="${f.downloadUrl}">下载字体包</a>
                <a href="${f.repo}" target="_blank" rel="noopener">开源仓库</a>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    document.querySelectorAll('.btn[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        render();
      });
    });
    qEl.addEventListener('input', render);

    fetch('./fonts.json')
      .then(r => r.json())
      .then(data => {
        allFonts = data.fonts || [];
        if (data.notice) document.getElementById('notice').textContent = data.notice;
        document.getElementById('meta').textContent = `共 ${allFonts.length} 款开源字体 · 更新于 ${data.updatedAt || ''}`;
        render();
      })
      .catch(err => {
        document.getElementById('meta').textContent = '加载失败：' + err;
      });
  </script>
</body>
</html>
